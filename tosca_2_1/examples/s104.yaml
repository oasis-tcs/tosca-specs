tosca_definitions_version: tosca_2_0

service_template:
# tag::s104[]
  outputs:
    server-url:
      description: Concatenate the URL for a server from other template values
      value: { $concat: [ 'http://', 
                      $get_attribute: [ server, public_address ],
                      ':', 
                      $get_attribute: [ server, port ] ] }
# end::s104[]
