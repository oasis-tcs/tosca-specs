tosca_definitions_version: tosca_2_0
node_types:
  YellowBox:
    description: A yellow box on a mermaid diagram
  Left:
    derived_from: YellowBox
  Right:
    derived_from: YellowBox

# tag::s126[]
service_template:
  inputs:
    number-of-left:
      type: integer
      default: 1

  node_templates:
    right:
      type: Right

    left:
      type: Left
      count: { $get_input: number-of-left }
      requirements:
      - uses: right
# end::s126[]
