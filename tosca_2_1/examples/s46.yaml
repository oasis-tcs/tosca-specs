tosca_definitions_version: tosca_2_0
capability_types:
  Endpoint:
    properties:
      port:
        type: integer
        required: false
node_types:
  MyService:
    properties:
      num-cpus:
        type: integer
    capabilities:
      bar:
        type: Endpoint
    requirements:
      - foo:
          capability: some-service.foo
          node: some-service
          relationship: some-service.foo
# tag::s46[]
service_template:
  inputs:
    cpus:
      type: integer
      validation: { $less_than: [ $value, 5 ] }

  substitution_mappings:
    node_type: MyService
    properties:  
      num-cpus: cpus
    capabilities:
      bar: [ some-service, bar ]
    requirements:
      foo: [ some-service, foo ]

  node_templates:
    some-service:
      type: MyService
      properties: 
        rate: 100
      capabilities:
        bar:
          properties:
            property-1: 80
      requirements:
        - foo: 
            ...
# end::s46[]

