tosca_definitions_version: tosca_2_0
data_types:
  PortDef:
    properties:
      port:
        type: integer
        validation:  { $in_range: [ $value, 1, 65535 ] }
capability_types:
# tag::s84[]
  Endpoint:
    properties:
      protocol:
        type: string
        required: true
        default: tcp
      port:
        type: PortDef
        required: false
      secure:
        type: boolean
        required: false
        default: false
# end::s84[]
