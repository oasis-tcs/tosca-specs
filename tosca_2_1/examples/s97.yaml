tosca_definitions_version: tosca_2_0
# tag::s97[]
data_types:
  NetworkInfo:
    properties:
      name:
        type: string
      gateway:
        type: string

RouterInfo:
    properties:
      ip:
        type: string
      external:
        type: string

service_template:
  inputs:
    management-network:
      type: NetworkInfo
    router:
      type: RouterInfo

  node_templates:
    bono-main:
      type: vRouter.Cisco
      directives: [ substitutable ]
      properties:
        mgmt-net-name: { $get_input: [ management-network, name ] }
        mgmt-cp-v4-fixed-ip: { $get_input: [ router, ip ] }
        mgmt-cp-gateway-ip: { $get_input: [ management-network, gateway ] }
        mgmt-cp-external-ip: { $get_input: [ router, external ] }
      requirements:
        - lan-port:
            node: host-with-net
            capability: VirtualBind
        - mgmt-net: mgmt-net
# end::s97[]
