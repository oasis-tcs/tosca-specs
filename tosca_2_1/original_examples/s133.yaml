tosca_definitions_version: tosca_2_0
# tag::s133[]
service_template:
  inputs:
    number-of-right:
      type: integer
    number-of-left:
      type: integer

  node_templates:
    right:
      type: Right
      count: { $get_input: number-of-right }

    left:
      type: Left
      count: { $get_input: number-of-left }
      requirements:
        - uses: [ right, { $remainder: [ $node_index, { $get_input: number-of-right } ] } ]
# end::s133[]
