tosca_definitions_version: tosca_2_0
# tag::s129[]
service_template:
  inputs:
    number-of-nodes:
      type: integer

  node_templates:
    right:
      type: Right
      count: { $get_input: number_of_nodes }

    left:
      type: Left
      count: { $get_input: number-of-nodes }
      requirements:
      - uses: [ right, $node_index ]
# end::s129[]
