tosca_definitions_version: tosca_2_0
# tag::s127[]
service_template:
  inputs:
    number-of-right:
      type: integer

  node_templates:
    right:
      type: Right
      count: { $get_input: number_of_right }

    left:
      type: Left
      requirements:
      - uses:
          node: right
          count: { $get_input: number-of-right }
# end::s127[]
