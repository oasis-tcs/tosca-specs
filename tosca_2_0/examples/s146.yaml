tosca_definitions_version: tosca_2_0

capability_types:
  Service:
    description: >-
      Ability to provide service.

relationship_types:
  ServedBy:
    description: >-
      Connection to a service.

node_types:
  Client:
    requirements:
    - service:
        capability: Service
        relationship: ServedBy
        node: Server
        count_range: [ 1, 4 ]

  Server:
    capabilities:
      service:
        type: Service
# EDITOR_TAG:{"type":"example","id":"s146","action":"end"} -->
