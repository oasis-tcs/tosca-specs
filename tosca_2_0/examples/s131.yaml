tosca_definitions_version: tosca_2_0
# EDITOR_TAG:{"type":"example","id":"s131","action":"start"} -->
service_template:
  inputs:
    number-of-nodes:
      type: integer

  node_templates:
    right:
      type: Right
      count: { $get_input: number-of-nodes }
      capabilities:
        feature:
          properties:
            target-count: 1

    left:
      type: Left
      count: { $get_input: number-of-nodes }
      requirements:
      - uses:
          node: right
          allocations:
            target-count: 1
# EDITOR_TAG:{"type":"example","id":"s131","action":"end"} -->
