node_templates:
  mysql:
    type: DBMS.MySQL
    properties:
      root-password: { $get_input: my-mysql-rootpw }
      port: { $get_input: my-mysql-port }
    requirements:
    - host: db-server
    interfaces:
      standard:
        operations:
          configure: scripts/my_own_configure.sh
