tosca_definitions_version: tosca_2_0

imports:
- types.yaml

node_types:
  ClientSoftware:
    requirements:
    - host:
        capability: Host
        relationship: HostedOn
        count_range: [ 1, 1 ]

service_template:
  substitution_mappings:
    node_type: Client
    requirements:
    - host: compute

  node_templates:
    software1:
      type: ClientSoftware

    software2:
      type: ClientSoftware

    compute:
      type: Compute
      directives: [select]
# EDITOR_TAG:{"type":"example","id":"s145","action":"end"} -->
