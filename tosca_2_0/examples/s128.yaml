tosca_definitions_version: tosca_2_0
# tag::s128[]
service_template:
  inputs:
    number-of-left:
      type: integer
    number-of-right:
      type: integer

  node_templates:
    right:
      type: Right
      count: { $get_input: number-of-right }

    left:
      type: Left
      count: { $get_input: number-of-left }
      requirements:
      - uses:
          node: right
          count: { $get_input: number-of-right }
# end::s128[]
